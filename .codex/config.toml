[agents]
enabled = true

[mcp_servers.playwright]
command = "npx"
args = ["--yes", "@playwright/mcp@0.0.86", "--isolated", "--headless", "--no-webmcp", "--sandbox"]
startup_timeout_sec = 60
disabled_tools = ["browser_evaluate", "browser_run_code_unsafe"]

[mcp_servers.playwright.env]
PLAYWRIGHT_MCP_ALLOWED_ORIGINS = "http://127.0.0.1:*;http://localhost:*"
