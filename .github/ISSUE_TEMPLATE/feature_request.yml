name: Feature request
description: Suggest a new feature or API improvement for AzerothJS
labels: [ enhancement ]
body:
    -   type: markdown
        attributes:
            value: |
                Thanks for taking the time to think through a proposal. The clearer the problem statement
                and the example code, the easier it is to evaluate and discuss the idea. Check existing
                issues and discussions first - your idea may already be in flight.

    -   type: textarea
        id: problem
        attributes:
            label: Problem statement
            description: >
                What problem are you trying to solve? What can you not do today, or what is unreasonably
                difficult? Be specific - a concrete pain point makes the proposal easier to evaluate.
            placeholder: |
                Disposing a root or a served app is a manual `dispose()` call, so an early return or a
                throw between creation and teardown leaks it. Every call site reinvents the same
                try/finally to stay correct.
        validations:
            required: true

    -   type: textarea
        id: proposal
        attributes:
            label: Proposed solution
            description: >
                What would you like to happen? Show what the feature looks like from the user's perspective.
                API sketches, example `.azeroth` components, or TypeScript signatures are welcome and
                strongly encouraged.
            render: tsx
            placeholder: |
                // Proposed: public disposables implement Symbol.dispose, so `using` tears
                // them down at the end of scope even on an early return or a throw.
                {
                    using served = await serve(app, { port: 3000 });
                    await runMigrations();
                }   // served.close() runs here, however the block exits
        validations:
            required: true

    -   type: dropdown
        id: package
        attributes:
            label: Relevant package
            description: Which package(s) would this feature primarily touch?
            multiple: true
            options:
                - "azerothjs (reactivity, renderer, control flow, router, forms, SSR)"
                - "@azerothjs/compiler (.azeroth syntax / IR / emitter / Vite plugin)"
                - "@azerothjs/kit (SSR, prerendering, hydration, production builds)"
                - "@azerothjs/http (server kernel; contracts at @azerothjs/http/api)"
                - "@azerothjs/schema (validation)"
                - "@azerothjs/ws (WebSockets)"
                - "@azerothjs/cron (scheduling)"
                - "@azerothjs/logger (logging)"
                - "@azerothjs/cli (the azeroth command)"
                - "create-azeroth (the scaffolder and its templates)"
                - "@azerothjs/testing"
                - "@azerothjs/devtools"
                - "@azerothjs/language-server (LSP + azeroth-tsc)"
                - "@azerothjs/typescript-plugin"
                - "@azerothjs/eslint-plugin"
                - "VS Code extension"
                - "JetBrains plugin"
                - "Cross-cutting / not sure"
        validations:
            required: true

    -   type: dropdown
        id: breaking
        attributes:
            label: Would this be a breaking change?
            options:
                - "No - purely additive"
                - "Yes - would alter existing public API or behaviour"
                - "Not sure"
        validations:
            required: true

    -   type: textarea
        id: alternatives
        attributes:
            label: Alternatives considered
            description: >
                Other approaches you have thought about and why they fall short, or workarounds you are
                using today that make the need concrete.
        validations:
            required: false

    -   type: textarea
        id: additional
        attributes:
            label: Additional context
            description: >
                Prior art in other frameworks, links to related discussions, relevant constraints, or
                anything else that would help evaluate the proposal.
        validations:
            required: false
